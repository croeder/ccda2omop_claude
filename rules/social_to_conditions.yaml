name: social_to_conditions
source:
  section: Observations
  section_oid: "2.16.840.1.113883.10.20.22.2.17"
  entry_xpath: "entry/observation"
  entry_type: SocialObservation
  extraction:
    - field: Code
      xpath: "code"
      type: code
    - field: EffectiveTime
      xpath: "effectiveTime"
      type: effective_time
    - field: Status
      xpath: "statusCode"
      type: code
  conditions:
    - type: domain_equals
      value: Condition
target:
  table: condition_occurrence
  type_concept_id: 32817
fields:
  - source: Code.Code
    target: condition_concept_id
    transform: vocab
    vocab_field: Code.CodeSystem
  - source: EffectiveTime.Low|EffectiveTime.Value
    target: condition_start_date
    transform: date
    optional: true
  - source: EffectiveTime.Low|EffectiveTime.Value
    target: condition_start_datetime
    transform: time_ptr
    optional: true
  - source: Code
    target: condition_source_value
    transform: format_source
id_gen:
  base_fields:
    - Code.Code
    - EffectiveTime.Low
  generator: condition
