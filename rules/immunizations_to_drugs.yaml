name: immunizations_to_drugs
source:
  section: Immunizations
  section_oid: "2.16.840.1.113883.10.20.22.2.2"
  section_oid_entries_required: "2.16.840.1.113883.10.20.22.2.2.1"
  entry_xpath: "entry/substanceAdministration"
  entry_type: Immunization
  extraction:
    - field: Code
      xpath: "consumable/manufacturedProduct/manufacturedMaterial/code"
      type: code
    - field: EffectiveTime
      xpath: "effectiveTime"
      type: time
    - field: Status
      xpath: "statusCode"
      type: code
    - field: RouteCode
      xpath: "routeCode"
      type: code
    - field: DoseQuantity
      xpath: "doseQuantity"
      type: quantity
    - field: LotNumber
      xpath: "consumable/manufacturedProduct/manufacturedMaterial/lotNumberText"
      type: string
target:
  table: drug_exposure
  type_concept_id: 32817
fields:
  - source: Code.Code
    target: drug_concept_id
    transform: vocab
    vocab_field: Code.CodeSystem
  - source: EffectiveTime
    target: drug_exposure_start_date
    transform: date
    optional: true
  - source: EffectiveTime
    target: drug_exposure_start_datetime
    transform: time_ptr
    optional: true
  - source: EffectiveTime
    target: drug_exposure_end_date
    transform: date
    optional: true
  - source: EffectiveTime
    target: drug_exposure_end_datetime
    transform: time_ptr
    optional: true
  - source: Code
    target: drug_source_value
    transform: format_source
  - source: LotNumber
    target: lot_number
    transform: string
    optional: true
  - source: RouteCode.DisplayName
    target: route_source_value
    transform: string
    optional: true
  - source: RouteCode.Code
    target: route_concept_id
    transform: route
    vocab_field: RouteCode.CodeSystem
    optional: true
  - source: DoseQuantity.Value
    target: quantity
    transform: float
    optional: true
  - source: DoseQuantity.Unit
    target: dose_unit_source_value
    transform: string
    optional: true
id_gen:
  base_fields:
    - Code.Code
    - EffectiveTime
  generator: drug
