name: labs_to_measurements
source:
  section: LabResults
  section_oid: "2.16.840.1.113883.10.20.22.2.3"
  section_oid_entries_required: "2.16.840.1.113883.10.20.22.2.3.1"
  entry_xpath: "entry/organizer/component/observation"
  entry_type: LabResult
  extraction:
    - field: Code
      xpath: "code"
      type: code
    - field: EffectiveTime
      xpath: "effectiveTime"
      type: time
    - field: Value
      xpath: "value/@value"
      type: float
    - field: ValueString
      xpath: "value/@value"
      type: string
    - field: Unit
      xpath: "value/@unit"
      type: string
    - field: Interpretation
      xpath: "interpretationCode"
      type: code
    - field: ReferenceRange
      xpath: "referenceRange/observationRange/value"
      type: quantity
  conditions:
    - type: domain_equals
      value: Measurement
target:
  table: measurement
  type_concept_id: 32817
fields:
  - source: Code.Code
    target: measurement_concept_id
    transform: vocab
    vocab_field: Code.CodeSystem
  - source: EffectiveTime
    target: measurement_date
    transform: date
    optional: true
  - source: EffectiveTime
    target: measurement_datetime
    transform: time_ptr
    optional: true
  - source: Code
    target: measurement_source_value
    transform: format_source
  - source: Value
    target: value_as_number
    transform: float
    optional: true
  - source: Value|ValueString
    target: value_source_value
    transform: string
    optional: true
  - source: Unit
    target: unit_source_value
    transform: string
    optional: true
  - source: Unit
    target: unit_concept_id
    transform: unit
    optional: true
  - source: ReferenceRange.Low
    target: range_low
    transform: float
    optional: true
  - source: ReferenceRange.High
    target: range_high
    transform: float
    optional: true
  - source: Interpretation.Code
    target: value_as_concept_id
    transform: value_vocab
    vocab_field: Interpretation.CodeSystem
    optional: true
id_gen:
  base_fields:
    - Code.Code
    - EffectiveTime
    - Value
  generator: measurement
