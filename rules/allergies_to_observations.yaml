name: allergies_to_observations
source:
  section: Allergies
  section_oid: "2.16.840.1.113883.10.20.22.2.6"
  section_oid_entries_required: "2.16.840.1.113883.10.20.22.2.6.1"
  entry_xpath: "entry/act/entryRelationship/observation"
  entry_type: Allergy
  extraction:
    - field: Substance
      xpath: "participant[@typeCode='CSM']/participantRole/playingEntity/code"
      type: code
    - field: Code
      xpath: "code"
      type: code
    - field: EffectiveTime
      xpath: "effectiveTime"
      type: effective_time
    - field: Status
      xpath: "statusCode"
      type: code
    - field: Reaction
      xpath: "entryRelationship/observation[code/@code='ASSERTION']/value"
      type: code
    - field: Severity
      xpath: "entryRelationship/observation[code/@code='SEV']/value"
      type: code
  conditions:
    - type: domain_equals
      value: Observation
target:
  table: observation
  type_concept_id: 32817
fields:
  - source: Substance.Code|Code.Code
    target: observation_concept_id
    transform: vocab
    vocab_field: Substance.CodeSystem|Code.CodeSystem
    optional: true
  - source: EffectiveTime.Low|EffectiveTime.Value
    target: observation_date
    transform: date
    optional: true
  - source: EffectiveTime.Low|EffectiveTime.Value
    target: observation_datetime
    transform: time_ptr
    optional: true
  - source: Substance|Code
    target: observation_source_value
    transform: format_source
    optional: true
  - source: Reaction.DisplayName
    target: value_as_string
    transform: string
    optional: true
  - source: Reaction.Code
    target: value_as_concept_id
    transform: value_vocab
    vocab_field: Reaction.CodeSystem
    optional: true
  - source: Severity.DisplayName
    target: qualifier_source_value
    transform: string
    optional: true
id_gen:
  base_fields:
    - Substance.Code
    - EffectiveTime.Low
  generator: observation
