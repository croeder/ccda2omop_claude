name: social_to_measurements
source:
  section: Observations
  section_oid: "2.16.840.1.113883.10.20.22.2.17"
  entry_xpath: "entry/observation"
  entry_type: SocialObservation
  extraction:
    - field: Code
      xpath: "code"
      type: code
    - field: EffectiveTime
      xpath: "effectiveTime"
      type: effective_time
    - field: Status
      xpath: "statusCode"
      type: code
    - field: Value
      xpath: "value"
      type: code
    - field: ValueQuantity
      xpath: "value"
      type: quantity
  conditions:
    - type: domain_equals
      value: Measurement
target:
  table: measurement
  type_concept_id: 32817
fields:
  - source: Code.Code
    target: measurement_concept_id
    transform: vocab
    vocab_field: Code.CodeSystem
  - source: EffectiveTime.Low|EffectiveTime.Value
    target: measurement_date
    transform: date
    optional: true
  - source: EffectiveTime.Low|EffectiveTime.Value
    target: measurement_datetime
    transform: time_ptr
    optional: true
  - source: Code
    target: measurement_source_value
    transform: format_source
  - source: Value.DisplayName
    target: value_source_value
    transform: string
    optional: true
  - source: Value.Code
    target: value_as_concept_id
    transform: value_vocab
    vocab_field: Value.CodeSystem
    optional: true
  - source: ValueQuantity.Value
    target: value_as_number
    transform: float
    optional: true
  - source: ValueQuantity.Unit
    target: unit_source_value
    transform: string
    optional: true
id_gen:
  base_fields:
    - Code.Code
    - EffectiveTime.Low
  generator: measurement
