name: procedures_to_measurements
source:
  section: Procedures
  section_oid: "2.16.840.1.113883.10.20.22.2.7"
  section_oid_entries_required: "2.16.840.1.113883.10.20.22.2.7.1"
  entry_xpath: "entry/procedure"
  entry_type: Procedure
  extraction:
    - field: Code
      xpath: "code"
      type: code
    - field: EffectiveTime
      xpath: "effectiveTime"
      type: effective_time
    - field: Status
      xpath: "statusCode"
      type: code
  conditions:
    - type: domain_equals
      value: Measurement
target:
  table: measurement
  type_concept_id: 32817
fields:
  - source: Code.Code
    target: measurement_concept_id
    transform: vocab
    vocab_field: Code.CodeSystem
  - source: EffectiveTime.Low|EffectiveTime.Value
    target: measurement_date
    transform: date
    optional: true
  - source: EffectiveTime.Low|EffectiveTime.Value
    target: measurement_datetime
    transform: time_ptr
    optional: true
  - source: Code
    target: measurement_source_value
    transform: format_source
id_gen:
  base_fields:
    - Code.Code
    - EffectiveTime.Low
  generator: measurement
