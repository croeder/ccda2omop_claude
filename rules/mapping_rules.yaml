# C-CDA to OMOP CDM Mapping Rules
# Each rule defines how to map a C-CDA section to an OMOP table

# Type concept IDs (how data was recorded)
# 32817 = EHR record

rules:
  - name: problems_to_conditions
    source:
      section: Problems
      entry_type: Problem
    target:
      table: condition_occurrence
      type_concept_id: 32817
    fields:
      - source: Code.Code
        target: condition_concept_id
        transform: vocab
        vocab_field: Code.CodeSystem
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: condition_start_date
        transform: date
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: condition_start_datetime
        transform: time_ptr
      - source: EffectiveTime.High
        target: condition_end_date
        transform: time_ptr
        optional: true
      - source: EffectiveTime.High
        target: condition_end_datetime
        transform: time_ptr
        optional: true
      - source: Code
        target: condition_source_value
        transform: format_source
    id_gen:
      base_fields:
        - Code.Code
        - EffectiveTime.Low
      generator: condition

  - name: medications_to_drugs
    source:
      section: Medications
      entry_type: Medication
    target:
      table: drug_exposure
      type_concept_id: 32817
    fields:
      - source: Code.Code
        target: drug_concept_id
        transform: vocab
        vocab_field: Code.CodeSystem
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: drug_exposure_start_date
        transform: date
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: drug_exposure_start_datetime
        transform: time_ptr
      - source: EffectiveTime.High|EffectiveTime.Low|EffectiveTime.Value
        target: drug_exposure_end_date
        transform: date
      - source: EffectiveTime.High|EffectiveTime.Low|EffectiveTime.Value
        target: drug_exposure_end_datetime
        transform: time_ptr
      - source: Code
        target: drug_source_value
        transform: format_source
      - source: RouteCode.DisplayName
        target: route_source_value
        transform: string
        optional: true
      - source: RouteCode.Code
        target: route_concept_id
        transform: route
        vocab_field: RouteCode.CodeSystem
        optional: true
      - source: DoseQuantity.Value
        target: quantity
        transform: float
        optional: true
      - source: DoseQuantity.Unit
        target: dose_unit_source_value
        transform: string
        optional: true
      - source: DaysSupply
        target: days_supply
        transform: int
        optional: true
      - source: Refills
        target: refills
        transform: int
        optional: true
      - source: Instructions
        target: sig
        transform: string
        optional: true
    id_gen:
      base_fields:
        - Code.Code
        - EffectiveTime.Low
      generator: drug

  - name: immunizations_to_drugs
    source:
      section: Immunizations
      entry_type: Immunization
    target:
      table: drug_exposure
      type_concept_id: 32817
    fields:
      - source: Code.Code
        target: drug_concept_id
        transform: vocab
        vocab_field: Code.CodeSystem
      - source: EffectiveTime
        target: drug_exposure_start_date
        transform: date
      - source: EffectiveTime
        target: drug_exposure_start_datetime
        transform: time_ptr
      - source: EffectiveTime
        target: drug_exposure_end_date
        transform: date
      - source: EffectiveTime
        target: drug_exposure_end_datetime
        transform: time_ptr
      - source: Code
        target: drug_source_value
        transform: format_source
      - source: LotNumber
        target: lot_number
        transform: string
        optional: true
      - source: RouteCode.DisplayName
        target: route_source_value
        transform: string
        optional: true
      - source: RouteCode.Code
        target: route_concept_id
        transform: route
        vocab_field: RouteCode.CodeSystem
        optional: true
      - source: DoseQuantity.Value
        target: quantity
        transform: float
        optional: true
      - source: DoseQuantity.Unit
        target: dose_unit_source_value
        transform: string
        optional: true
    id_gen:
      base_fields:
        - Code.Code
        - EffectiveTime
      generator: drug

  - name: procedures_to_procedures
    source:
      section: Procedures
      entry_type: Procedure
    target:
      table: procedure_occurrence
      type_concept_id: 32817
    fields:
      - source: Code.Code
        target: procedure_concept_id
        transform: vocab
        vocab_field: Code.CodeSystem
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: procedure_date
        transform: date
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: procedure_datetime
        transform: time_ptr
      - source: Code
        target: procedure_source_value
        transform: format_source
      - source: TargetSite.DisplayName
        target: modifier_source_value
        transform: string
        optional: true
    id_gen:
      base_fields:
        - Code.Code
        - EffectiveTime.Low
      generator: procedure

  - name: vitals_to_measurements
    source:
      section: VitalSigns
      entry_type: VitalSign
    target:
      table: measurement
      type_concept_id: 32817
    fields:
      - source: Code.Code
        target: measurement_concept_id
        transform: vocab
        vocab_field: Code.CodeSystem
      - source: EffectiveTime
        target: measurement_date
        transform: date
      - source: EffectiveTime
        target: measurement_datetime
        transform: time_ptr
      - source: Code
        target: measurement_source_value
        transform: format_source
      - source: Value
        target: value_as_number
        transform: float
        optional: true
      - source: Unit
        target: unit_source_value
        transform: string
        optional: true
      - source: Unit
        target: unit_concept_id
        transform: unit
        optional: true
      - source: Value
        target: value_source_value
        transform: string
        optional: true
    id_gen:
      base_fields:
        - Code.Code
        - EffectiveTime
        - Value
      generator: measurement

  - name: labs_to_measurements
    source:
      section: LabResults
      entry_type: LabResult
    target:
      table: measurement
      type_concept_id: 32817
    fields:
      - source: Code.Code
        target: measurement_concept_id
        transform: vocab
        vocab_field: Code.CodeSystem
      - source: EffectiveTime
        target: measurement_date
        transform: date
      - source: EffectiveTime
        target: measurement_datetime
        transform: time_ptr
      - source: Code
        target: measurement_source_value
        transform: format_source
      - source: Value
        target: value_as_number
        transform: float
        optional: true
      - source: Value|ValueString
        target: value_source_value
        transform: string
        optional: true
      - source: Unit
        target: unit_source_value
        transform: string
        optional: true
      - source: Unit
        target: unit_concept_id
        transform: unit
        optional: true
      - source: ReferenceRange.Low
        target: range_low
        transform: float
        optional: true
      - source: ReferenceRange.High
        target: range_high
        transform: float
        optional: true
    id_gen:
      base_fields:
        - Code.Code
        - EffectiveTime
        - Value
      generator: measurement

  - name: allergies_to_observations
    source:
      section: Allergies
      entry_type: Allergy
    target:
      table: observation
      type_concept_id: 32817
    fields:
      - source: Substance.Code|Code.Code
        target: observation_concept_id
        transform: vocab
        vocab_field: Substance.CodeSystem|Code.CodeSystem
        optional: true
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: observation_date
        transform: date
        optional: true
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: observation_datetime
        transform: time_ptr
        optional: true
      - source: Substance|Code
        target: observation_source_value
        transform: format_source
        optional: true
      - source: Reaction.DisplayName
        target: value_as_string
        transform: string
        optional: true
      - source: Severity.DisplayName
        target: qualifier_source_value
        transform: string
        optional: true
    id_gen:
      base_fields:
        - Substance.Code
        - EffectiveTime.Low
      generator: observation

  - name: social_to_observations
    source:
      section: Observations
      entry_type: SocialObservation
    target:
      table: observation
      type_concept_id: 32817
    fields:
      - source: Code.Code
        target: observation_concept_id
        transform: vocab
        vocab_field: Code.CodeSystem
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: observation_date
        transform: date
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: observation_datetime
        transform: time_ptr
      - source: Code
        target: observation_source_value
        transform: format_source
      - source: Value.DisplayName
        target: value_as_string
        transform: string
        optional: true
      - source: ValueQuantity.Value
        target: value_as_number
        transform: float
        optional: true
      - source: ValueQuantity.Unit
        target: unit_source_value
        transform: string
        optional: true
    id_gen:
      base_fields:
        - Code.Code
        - EffectiveTime.Low
      generator: observation

  - name: devices_to_device_exposure
    source:
      section: Devices
      entry_type: Device
    target:
      table: device_exposure
      type_concept_id: 32817
    fields:
      - source: Code.Code
        target: device_concept_id
        transform: vocab
        vocab_field: Code.CodeSystem
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: device_exposure_start_date
        transform: date
      - source: EffectiveTime.Low|EffectiveTime.Value
        target: device_exposure_start_datetime
        transform: time_ptr
      - source: EffectiveTime.High
        target: device_exposure_end_date
        transform: time_ptr
        optional: true
      - source: EffectiveTime.High
        target: device_exposure_end_datetime
        transform: time_ptr
        optional: true
      - source: Code
        target: device_source_value
        transform: format_source
      - source: UDI
        target: unique_device_id
        transform: string
        optional: true
    id_gen:
      base_fields:
        - Code.Code
        - EffectiveTime.Low
      generator: device
