name: problems_to_conditions
source:
  section: Problems
  section_oid: "2.16.840.1.113883.10.20.22.2.5"
  section_oid_entries_required: "2.16.840.1.113883.10.20.22.2.5.1"
  entry_xpath: "entry/act/entryRelationship/observation"
  entry_type: Problem
  extraction:
    - field: Code
      xpath: "value"
      type: code
    - field: CodeFallback
      xpath: "code"
      type: code
    - field: EffectiveTime
      xpath: "effectiveTime"
      type: effective_time
    - field: Status
      xpath: "statusCode"
      type: code
  conditions:
    - type: domain_equals
      value: Condition
target:
  table: condition_occurrence
  type_concept_id: 32817
fields:
  - source: Code.Code|CodeFallback.Code
    target: condition_concept_id
    transform: vocab
    vocab_field: Code.CodeSystem|CodeFallback.CodeSystem
  - source: EffectiveTime.Low|EffectiveTime.Value
    target: condition_start_date
    transform: date
    optional: true
  - source: EffectiveTime.Low|EffectiveTime.Value
    target: condition_start_datetime
    transform: time_ptr
    optional: true
  - source: EffectiveTime.High
    target: condition_end_date
    transform: time_ptr
    optional: true
  - source: EffectiveTime.High
    target: condition_end_datetime
    transform: time_ptr
    optional: true
  - source: Code|CodeFallback
    target: condition_source_value
    transform: format_source
id_gen:
  base_fields:
    - Code.Code
    - EffectiveTime.Low
  generator: condition
